# Disposable local development. Production deployment is documented in docs/OPERATIONS.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: privateid_db
      POSTGRES_USER: privateid
      POSTGRES_PASSWORD: privateid_dev
    volumes:
      - privateid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privateid -d privateid_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      SITE_URL: http://localhost:3001
      PRIVATEID_ISSUER: http://localhost:3001
      DATABASE_URL: postgres://privateid:privateid_dev@db:5432/privateid_db
      PRIVATEID_PROOF_SECRET: local-proof-secret-000000000000000000000001
      PRIVATEID_SUBJECT_SECRET: local-subject-secret-0000000000000000000001
      DATA_ENCRYPTION_KEY: ERERERERERERERERERERERERERERERERERERERERERE=
      BILLING_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - privateid-local:/app/.data
    depends_on:
      db:
        condition: service_healthy
volumes:
  privateid-data:
  privateid-local:
