name: Validate PrivateID
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: privateid_test
          POSTGRES_PASSWORD: privateid_test_only
          POSTGRES_DB: privateid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U privateid_test -d privateid_test"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://privateid_test:privateid_test_only@localhost:5432/privateid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t privateid:ci .
